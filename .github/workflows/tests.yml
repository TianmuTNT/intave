name: Self-tests

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Export configured Paper versions
        id: matrix
        run: |
          ./gradlew exportPaperTestMatrix
          echo "matrix=$(cat build/paper-test-matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          java-version: '16'
          distribution: 'temurin'

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run Paper self-test
        env:
          MINECRAFT_VERSION: ${{ matrix.version }}
        run: ./gradlew "testPaper${MINECRAFT_VERSION//./_}"
